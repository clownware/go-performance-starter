name: Enhancement
description: A new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change. Name the ADRs it touches; if it conflicts with an Accepted ADR, say so — that makes it a decision, not an enhancement.
  - type: textarea
    id: budget
    attributes:
      label: Budget and scope impact
      description: New dependency? JS/CSS weight? Binary size? New endpoint or form (attack surface)? See ADR-000 and ADR-019.
